[package]
name = "polyph-web"
description = "A room member that runs in the browser (phone PWA): the room engine over a relay WebSocket, compiled to WebAssembly."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
polyph-proto = { workspace = true }
polyph-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
polyph-proto = { workspace = true, features = ["wasm"] }
wasm-bindgen = "0.2.130"
js-sys = "0.3"
