[package]
name = "polyph-daemon"
description = "Polyph daemon: rooms, relay connections, joins, LAN mode and the local API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
polyph-proto = { workspace = true }
polyph-core = { workspace = true }
polyph-relay = { workspace = true }
polyph-agents = { workspace = true }
polyph-sandbox = { workspace = true }
polyph-mcp = { workspace = true }
polyph-git = { workspace = true }
polyph-merge = { workspace = true }
polyph-term = { workspace = true }
base64 = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
hmac = "0.12"
polyph-i18n = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2 = "0.10"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "signal"] }
futures-util = { workspace = true }
axum = { workspace = true, features = ["ws", "http1", "tokio", "json", "query"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
directories = { workspace = true }
parking_lot = { workspace = true }
hex = { workspace = true }
time = { workspace = true }
chacha20poly1305 = "0.10"
getrandom = "0.2"
zeroize = "1.8"
mdns-sd = "0.21"
if-addrs = "0.13"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
yrs = "0.28"
blake3 = "1.8"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "4", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = { workspace = true }
