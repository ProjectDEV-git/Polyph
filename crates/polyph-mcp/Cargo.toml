[package]
name = "polyph-mcp"
description = "Polyph's MCP server for agents: claims, team state, inboxes and memory notes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
tokio = { workspace = true, features = ["rt", "macros", "io-std", "io-util", "net", "time", "sync", "signal"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
polyph-sandbox = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
