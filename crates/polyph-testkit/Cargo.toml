[package]
name = "polyph-testkit"
description = "Test harnesses for Polyph: relay load test, multi-daemon harness, fake ACP agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "polyph-loadtest"
path = "src/bin/loadtest.rs"

[[bin]]
name = "polyph-fake-agent"
path = "src/bin/fake_agent.rs"

[[bin]]
name = "polyph-test-sandbox-exec"
path = "src/bin/sandbox_exec.rs"

[[bin]]
name = "polyph-test-localagent"
path = "src/bin/localagent.rs"

[dependencies]
polyph-proto = { workspace = true }
polyph-relay = { workspace = true }
polyph-daemon = { workspace = true }
polyph-agents = { workspace = true }
polyph-localagent = { workspace = true }
axum = { workspace = true, features = ["http1", "tokio", "json"] }
parking_lot = { workspace = true }
polyph-sandbox = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process", "sync", "io-std", "io-util", "fs"] }
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
polyph-relay = { workspace = true }
