[package]
name = "polyph-testkit"
description = "Test harnesses for Polyph: relay load test, multi-daemon harness, fake ACP agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "polyph-loadtest"
path = "src/bin/loadtest.rs"

[[bin]]
name = "polyph-fake-agent"
path = "src/bin/fake_agent.rs"

[[bin]]
name = "polyph-multinet-node"
path = "src/bin/multinet_node.rs"

[[bin]]
name = "polyph-test-sandbox-exec"
path = "src/bin/sandbox_exec.rs"

[[bin]]
name = "polyph-test-mcp"
path = "src/bin/mcp.rs"

[[bin]]
name = "polyph-test-plugin-mcp"
path = "src/bin/plugin_mcp.rs"

[[bin]]
name = "polyph-test-localagent"
path = "src/bin/localagent.rs"

[dependencies]
polyph-proto = { workspace = true }
polyph-relay = { workspace = true }
polyph-daemon = { workspace = true }
polyph-agents = { workspace = true }
polyph-localagent = { workspace = true }
polyph-mcp = { workspace = true }
polyph-tui = { workspace = true }
polyph-phone = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["connect"] }
futures-util = { workspace = true }
axum = { workspace = true, features = ["http1", "tokio", "json"] }
parking_lot = { workspace = true }
polyph-sandbox = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process", "sync", "io-std", "io-util", "fs"] }
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
polyph-git = { workspace = true }
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"
polyph-i18n = { workspace = true }
hmac = "0.12"
sha2 = "0.10"
hex = { workspace = true }
polyph-relay = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "4", default-features = false, features = ["tokio"] }
