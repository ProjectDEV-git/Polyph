[package]
name = "polyph-phone"
description = "Polyph's browser-only room member: the room engine over the relay, with no daemon (the phone PWA)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasm = ["dep:wasm-bindgen", "polyph-proto/wasm"]

[dependencies]
polyph-proto = { workspace = true }
polyph-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
wasm-bindgen = { version = "0.2.130", optional = true }
