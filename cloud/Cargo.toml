[package]
name = "polyph-cloud"
description = "Polyph's hosted service: accounts, teams, plans, billing and the hosted relay's plan policy"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license-file = "LICENSE"
publish = false

# Built on its own so the open-source workspace never depends on it:
#   cargo build --manifest-path cloud/Cargo.toml --target-dir target
[workspace]

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "warn"

[[bin]]
name = "polyph-cloud"
path = "src/main.rs"

[dependencies]
polyph-proto = { path = "../crates/polyph-proto" }
polyph-relay = { path = "../crates/polyph-relay" }
polyph-i18n = { path = "../crates/polyph-i18n" }
tokio = { version = "1.54", default-features = false, features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query", "form"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
toml = "0.9"
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "form"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
parking_lot = "0.12"
clap = { version = "4.6", features = ["derive", "env"] }
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
