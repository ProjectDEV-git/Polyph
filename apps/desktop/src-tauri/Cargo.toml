[package]
name = "polyph-desktop"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Polyph desktop app: the shared UI, a tray, the status pill and native notifications."
publish = false

[lib]
name = "polyph_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
polyph-i18n = { path = "../../../crates/polyph-i18n" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"

[profile.release]
lto = true
codegen-units = 1
strip = true
