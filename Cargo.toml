[workspace]
resolver = "3"
members = [
  "crates/polyph-proto",
  "crates/polyph-core",
  "crates/polyph-phone",
  "crates/polyph-agents",
  "crates/polyph-localagent",
  "crates/polyph-sandbox",
  "crates/polyph-mcp",
  "crates/polyph-git",
  "crates/polyph-merge",
  "crates/polyph-term",
  "crates/polyph-plugins",
  "crates/polyph-i18n",
  "crates/polyph-daemon",
  "crates/polyph-tui",
  "crates/polyph-cli",
  "crates/polyph-relay",
  "crates/polyph-testkit",
]
# The proprietary cloud crate and the Tauri app are built separately so the
# open-source workspace never depends on them.
exclude = ["cloud", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/ProjectDEV-git/Polyph"
authors = ["Polyph contributors"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "warn"

[workspace.dependencies]
# internal
polyph-proto = { path = "crates/polyph-proto", version = "0.1.0" }
polyph-core = { path = "crates/polyph-core", version = "0.1.0" }
polyph-phone = { path = "crates/polyph-phone", version = "0.1.0" }
polyph-agents = { path = "crates/polyph-agents", version = "0.1.0" }
polyph-localagent = { path = "crates/polyph-localagent", version = "0.1.0" }
polyph-sandbox = { path = "crates/polyph-sandbox", version = "0.1.0" }
polyph-mcp = { path = "crates/polyph-mcp", version = "0.1.0" }
polyph-git = { path = "crates/polyph-git", version = "0.1.0" }
polyph-merge = { path = "crates/polyph-merge", version = "0.1.0" }
polyph-term = { path = "crates/polyph-term", version = "0.1.0" }
polyph-plugins = { path = "crates/polyph-plugins", version = "0.1.0" }
polyph-i18n = { path = "crates/polyph-i18n", version = "0.1.0" }
polyph-daemon = { path = "crates/polyph-daemon", version = "0.1.0" }
polyph-tui = { path = "crates/polyph-tui", version = "0.1.0" }
polyph-relay = { path = "crates/polyph-relay", version = "0.1.0" }
polyph-testkit = { path = "crates/polyph-testkit", version = "0.1.0" }

# async and networking
tokio = { version = "1.54", default-features = false }
tokio-util = "0.7"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
axum = { version = "0.8.9", default-features = false }
tokio-tungstenite = { version = "0.30", default-features = false }
tower = "0.5"
bytes = "1"

# serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
ciborium = "0.2.2"
toml = "0.9"

# errors and logging
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# misc
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"
directories = "6"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
dashmap = "6"

# testing
proptest = "1.12"
tempfile = "3"

# The phone engine's wasm build (scripts/build-phone-wasm.mjs): small over fast.
# Stripped: wasm-bindgen warns it cannot read target features, which the
# engine does not rely on (no reference types or threads).
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Release archives (scripts/release/package.mjs): smaller, stripped binaries.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 4
strip = true
