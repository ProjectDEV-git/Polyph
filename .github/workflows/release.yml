name: Release

# Pushing a tag such as v0.1.0 builds everything that ships and opens a
# *draft* GitHub release; a person reviews it and publishes. Running it by
# hand (workflow_dispatch) builds and checks the same files without a release.
# See docs/release.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Versions match the tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            node scripts/release/version.mjs --check "$GITHUB_REF_NAME"
            node scripts/release/notes.mjs "$GITHUB_REF_NAME" > /dev/null
          fi
          echo "version=$(node -p "require('./apps/web/package.json').version")" >> "$GITHUB_OUTPUT"

  web:
    name: Website, browser client and phone app
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen (the version in Cargo.lock)
        shell: bash
        run: |
          v=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          echo "WASM_BINDGEN=$v" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @polyph/web build
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: apps/web/out
          if-no-files-found: error

  build:
    name: ${{ matrix.target }}
    needs: [version, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds run on the oldest supported Ubuntu for a low glibc floor.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundles: "deb,rpm,appimage" }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, bundles: "deb,rpm" }
          - { os: macos-15-intel, target: x86_64-apple-darwin, bundles: "app,dmg" }
          - { os: macos-15, target: aarch64-apple-darwin, bundles: "app,dmg" }
          - { os: windows-2022, target: x86_64-pc-windows-msvc, bundles: "nsis,msi" }
    runs-on: ${{ matrix.os }}
    env:
      # macOS signing and notarization (Tauri reads these); unset = unsigned.
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: apps/web/out
      - name: Linux packages for the desktop app
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev patchelf bubblewrap
      - name: Build polyph and polyph-relay
        run: cargo build --profile dist --locked -p polyph-cli -p polyph-relay
      - name: Pack the archive
        run: node scripts/release/package.mjs --profile dist --version ${{ needs.version.outputs.version }}
      - name: Smoke test the archive
        shell: bash
        run: scripts/release/smoke.sh "$(ls dist/polyph-*-${{ matrix.target }}.tar.gz dist/polyph-*-${{ matrix.target }}.zip 2>/dev/null | head -n1)"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Desktop app with polyph inside
        shell: bash
        run: |
          node scripts/release/desktop-prep.mjs --profile dist
          cd apps/desktop
          pnpm tauri build --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}
      - name: Collect the desktop packages
        shell: bash
        run: |
          shopt -s nullglob
          b=apps/desktop/src-tauri/target/release/bundle
          for f in $b/deb/*.deb $b/rpm/*.rpm $b/appimage/*.AppImage $b/dmg/*.dmg $b/msi/*.msi $b/nsis/*.exe; do
            cp "$f" dist/
          done
          if [ -d "$b/macos" ]; then
            (cd "$b/macos" && tar -czf "$GITHUB_WORKSPACE/dist/Polyph-${{ needs.version.outputs.version }}-${{ matrix.target }}.app.tar.gz" Polyph.app)
          fi
          ls -la dist
      - name: Relay binary for the container image
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p image
          arch=$([ "${{ matrix.target }}" = x86_64-unknown-linux-gnu ] && echo amd64 || echo arm64)
          cp target/dist/polyph-relay "image/polyph-relay-$arch"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: image-${{ matrix.target }}
          path: image/*

  vscode:
    name: VS Code extension
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter polyph-vscode package
      - uses: actions/upload-artifact@v4
        with:
          name: dist-vscode
          path: dist/*.vsix
          if-no-files-found: error

  release:
    name: Draft release, image and provenance
    needs: [version, build, vscode]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: image
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          rm -f *.sha256
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        shell: bash
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/polyph-relay" >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: image
          file: deploy/relay/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release/notes.mjs "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
            --title "Polyph ${GITHUB_REF_NAME#v}" --notes-file notes.md
