name: Linux libraries for the desktop app
description: WebKitGTK and friends for building the Tauri app, plus bubblewrap for the agent sandbox.
runs:
  using: composite
  steps:
    - name: Install packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
          librsvg2-dev libsoup-3.0-dev patchelf bubblewrap
